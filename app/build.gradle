apply plugin: 'com.android.application'

android {
    namespace "example.prada.lab.pradaoutlook"
    compileSdkVersion 35

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "example.prada.lab.pradaoutlook"
        minSdkVersion 23
        targetSdkVersion 24
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    lint {
        // Preserve legacy runtime behavior; Play publishing requires a separate target SDK migration.
        warning "ExpiredTargetSdkVersion"
    }

    buildTypes {
        debug {
            testCoverageEnabled true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
    implementation 'com.android.support:appcompat-v7:24.2.1'
    implementation 'com.android.support:design:24.2.1'

    implementation 'com.github.sundeepk:compact-calendar-view:1.9.7'
    implementation 'org.zakariya.stickyheaders:stickyheaders:0.7.5'
    implementation 'com.getbase.android.db:library:0.13.1'
    implementation 'com.parse.bolts:bolts-tasks:1.4.0'
    implementation 'com.google.code.gson:gson:2.7'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.karumi:dexter:2.2.2'

    androidTestImplementation 'com.android.support:support-annotations:24.2.1'
    androidTestImplementation 'com.android.support.test:runner:0.5'
    androidTestImplementation 'com.android.support.test:rules:0.5'
    // Optional -- Hamcrest library
    androidTestImplementation 'org.hamcrest:hamcrest-library:1.3'
}
